name: container-play-mysql8-replication
x-mysql: &mysql
  image: mysql:8.0
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Admin123}
    MYSQL_ROOT_HOST: "%"
  healthcheck:
    test: [CMD-SHELL, "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -uroot -h 127.0.0.1 -e 'SELECT 1' >/dev/null"]
    interval: 5s
    retries: 30
services:
  mysql-primary:
    <<: *mysql
    hostname: mysql-primary
    command:
      - --server-id=1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-bin=mysql-bin
      - --log-replica-updates=ON
      - --binlog-format=ROW
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PRIMARY_HOST_PORT:-3306}:3306"
    volumes:
      - primary_data:/var/lib/mysql

  mysql-replica:
    <<: *mysql
    hostname: mysql-replica
    command:
      - --server-id=2
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-bin=mysql-bin
      - --log-replica-updates=ON
      - --binlog-format=ROW
      - --read-only=ON
      - --super-read-only=ON
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MYSQL_REPLICA_HOST_PORT:-3307}:3306"
    volumes:
      - replica_data:/var/lib/mysql

  mysql-replication-init:
    image: mysql:8.0
    depends_on:
      mysql-primary: {condition: service_healthy}
      mysql-replica: {condition: service_healthy}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Admin123}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD:-Admin123}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:-Admin123}
      MYSQL_CONFIGURE_PROXY: ${MYSQL_CONFIGURE_PROXY:-false}
    volumes:
      - ./init-replication.sh:/init.sh:ro
    entrypoint: [bash, /init.sh]
    restart: "no"

  proxysql:
    profiles: [proxy]
    image: proxysql/proxysql:2.7.3
    depends_on:
      mysql-replication-init: {condition: service_completed_successfully}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PROXY_HOST_PORT:-6033}:6033"
    volumes:
      - ./proxysql.cnf:/etc/proxysql.cnf:ro
      - proxysql_data:/var/lib/proxysql

  proxysql-init:
    profiles: [proxy]
    image: mysql:8.0
    depends_on:
      proxysql: {condition: service_started}
    environment:
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:-Admin123}
    volumes:
      - ./init-proxysql.sh:/init.sh:ro
    entrypoint: [bash, /init.sh]
    restart: "no"

volumes:
  primary_data:
  replica_data:
  proxysql_data:
