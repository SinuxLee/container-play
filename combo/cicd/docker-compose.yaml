services:
  gitea:
    image: gitea/gitea:1.25
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL:-http://localhost:3000/}
      - GITEA__server__HTTP_PORT=3000
      # 可选：内置 SSH
      - GITEA__server__SSH_PORT=2222
    volumes:
      - gitea_data:/data
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:3000:3000"   # Web
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:2222:22"     # SSH
    networks: [cicd]

  jenkins:
    image: jenkins/jenkins:lts-alpine-jdk21
    container_name: jenkins
    restart: unless-stopped
    environment:
      - JENKINS_OPTS=--httpPort=8080
    volumes:
      - jenkins_home:/var/jenkins_home
      # 需要构建容器镜像时，请配置专用构建代理与受控的 Docker 访问权限。
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8080:8080"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:50000:50000" # agent
    networks: [cicd]
    depends_on: [gitea]

networks:
  cicd:

volumes:
  gitea_data:
  jenkins_home:
