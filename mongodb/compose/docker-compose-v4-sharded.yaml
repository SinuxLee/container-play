# Legacy MongoDB 4.4 single or two-shard local demo; no authentication.
name: container-play-mongo4-shards
services:
  mongodb-cfg:
    image: mongo:4.4.25
    command: [mongod, --configsvr, --replSet, cfgReplSet, --bind_ip_all, --port, "27019"]
    volumes:
      - cfg_data:/data/configdb
    healthcheck:
      test: [CMD, mongo, --host, localhost:27019, --quiet, --eval, "db.adminCommand({ping:1}).ok"]
      interval: 5s
      retries: 20

  mongodb-cfg-init:
    image: mongo:4.4.25
    depends_on:
      mongodb-cfg:
        condition: service_healthy
    volumes:
      - ./init-v4/config-replica-set.sh:/init.sh:ro
    entrypoint: [bash, /init.sh]
    restart: "no"

  mongodb-shard0:
    image: mongo:4.4.25
    command: [mongod, --shardsvr, --replSet, shard0ReplSet, --bind_ip_all, --port, "27018"]
    volumes:
      - shard0_data:/data/db
    healthcheck:
      test: [CMD, mongo, --host, localhost:27018, --quiet, --eval, "db.adminCommand({ping:1}).ok"]
      interval: 5s
      retries: 20

  mongodb-shard0-init:
    image: mongo:4.4.25
    depends_on:
      mongodb-shard0:
        condition: service_healthy
    volumes:
      - ./init-v4/shard-replica-set.sh:/init.sh:ro
    entrypoint: [bash, /init.sh]
    restart: "no"

  mongodb-mongos:
    image: mongo:4.4.25
    depends_on:
      mongodb-cfg-init:
        condition: service_completed_successfully
    command: [mongos, --configdb, cfgReplSet/mongodb-cfg:27019, --bind_ip_all, --port, "27017"]
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MONGODB_V4_HOST_PORT:-27017}:27017"

  mongodb-add-shard:
    image: mongo:4.4.25
    depends_on:
      mongodb-shard0-init:
        condition: service_completed_successfully
      mongodb-mongos:
        condition: service_started
    volumes:
      - ./init-v4/add-shard0.sh:/init.sh:ro
    entrypoint: [bash, /init.sh]
    restart: "no"

  mongodb-shard1:
    profiles: [multi]
    image: mongo:4.4.25
    command: [mongod, --shardsvr, --replSet, shard1ReplSet, --bind_ip_all, --port, "27018"]
    volumes:
      - shard1_data:/data/db
    healthcheck:
      test: [CMD, mongo, --host, localhost:27018, --quiet, --eval, "db.adminCommand({ping:1}).ok"]
      interval: 5s
      retries: 20

  mongodb-shard1-init:
    profiles: [multi]
    image: mongo:4.4.25
    depends_on:
      mongodb-shard1:
        condition: service_healthy
    volumes:
      - ./init-v4/shard1-replica-set.sh:/init.sh:ro
    entrypoint: [bash, /init.sh]
    restart: "no"

  mongodb-add-shard1:
    profiles: [multi]
    image: mongo:4.4.25
    depends_on:
      mongodb-add-shard:
        condition: service_completed_successfully
      mongodb-shard1-init:
        condition: service_completed_successfully
      mongodb-mongos:
        condition: service_started
    volumes:
      - ./init-v4/add-shard1.sh:/init.sh:ro
    entrypoint: [bash, /init.sh]
    restart: "no"

volumes:
  cfg_data:
  shard0_data:
  shard1_data:
